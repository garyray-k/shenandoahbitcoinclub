<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <link rel="stylesheet" href="style.css">
  <title>Shenandoah Bitcoin Club</title>
</head>
<body>
  <header>
    <nav class="site-nav">
      <a href="index.html" class="site-nav__link site-nav__link--active">Home</a>
      <a href="about.html" class="site-nav__link">About</a>
      <a href="learn.html" class="site-nav__link">Learn</a>
      <a href="support.html" class="site-nav__link">Support</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <img class="hero__logo" src="images/shenandoahbitcoinlogo.png" alt="Shenandoah Bitcoin Club logo">
      <h1 class="hero__title">Shenandoah Bitcoin Club</h1>
      <p class="hero__subtitle">Educating and collaborating on Bitcoin in the Northern Shenandoah Valley.</p>
    </section>

    <section class="meetups">
      <h2 class="meetups__heading">Join Us Monthly</h2>
      <div class="meetup-cards">
        <div class="meetup-card">
          <img class="meetup-card__image" src="images/harpers-ferry.jpeg" alt="Harpers Ferry Bitcoin Meetup — 1st Saturday, 10AM-Noon, Appalachian Snail Market & Cafe, 970 W Washington St, Harpers Ferry, WV">
        </div>
        <div class="meetup-card">
          <img class="meetup-card__image" src="images/sbc.jpeg" alt="Shenandoah Bitcoin Club — 3rd Saturday, 10AM-Noon, Daily Buzz Cafe, 7815 Main St, Middletown, VA 22645">
        </div>
      </div>
      <p>
        Check out our
        <a href="https://www.meetup.com/shenandoah-bitcoin-club/" target="_blank">Meetup.com page</a>
        to see the next upcoming meetup.
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; Shenandoah Bitcoin Club</p>
    <p class="site-footer__friends">
      Are you a veteran? Check out
      <a href="https://nextmissionresources.com" target="_blank">nextmissionresources.com</a>
    </p>
  </footer>
</body>
</html>
